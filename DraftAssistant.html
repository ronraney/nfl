<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL 2026 Best Ball Draft Assistant</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #0f1117;
  --surface:    #1a1d26;
  --surface2:   #232635;
  --border:     #2e3244;
  --text:       #e8eaf0;
  --muted:      #7a7f96;
  --green:      #22c55e;
  --green-bg:   #0f2a1a;
  --blue:       #3b82f6;
  --blue-dim:   #1d4ed8;
  --blue-light: #60a5fa;
  --blue-bg:    #0f1e3a;
  --blue-bg2:   #1a2a50;
  --yellow:     #f59e0b;
  --yellow-bg:  #2a1f00;
  --accent:     #6366f1;
}

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header-title { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.draft-select {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  max-width: 200px;
}
.draft-select:focus { outline: none; border-color: var(--accent); }
.round-badge {
  background: var(--accent);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 20px;
}

/* ── BUTTONS ── */
.btn {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}
.btn:hover { background: var(--border); }

.btn-draft {
  background: var(--green);
  color: #000;
  border: none;
  width: 100%;
  padding: 10px;
  font-size: 14px;
  font-weight: 700;
  border-radius: 8px;
  margin-top: 10px;
  cursor: pointer;
}
.btn-draft:hover { opacity: 0.9; }
.btn-draft:disabled {
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
  cursor: default;
}

/* ── LAYOUT ── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── LEFT PANEL ── */
.left-panel {
  width: 280px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 12px;
  gap: 8px;
  overflow: hidden;
}
.round-info {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}
.search-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 13px;
  width: 100%;
}
.search-box:focus { outline: none; border-color: var(--accent); }
.filter-row { display: flex; gap: 5px; }
.pos-btn {
  flex: 1;
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 5px 2px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 700;
  text-align: center;
}
.pos-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.sort-row { display: flex; gap: 5px; }
.sort-btn {
  flex: 1;
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 4px 2px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 10px;
  font-weight: 700;
  text-align: center;
}
.sort-btn.active { color: var(--text); border-color: var(--accent); }

.player-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.p-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  cursor: pointer;
  user-select: none;
}
.p-card:hover { border-color: var(--accent); }
.p-card.selected { border-color: var(--green); background: var(--green-bg); }
.p-card.stack-gone { opacity: 0.4; }

.p-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
}
.p-name {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.v-badge {
  font-size: 14px;
  font-weight: 800;
  flex-shrink: 0;
  /* color set inline per player */
}
.p-meta {
  display: flex;
  justify-content: space-between;
  margin-top: 3px;
}
.p-team { font-size: 11px; color: var(--muted); }
.sp { color: var(--blue-light); font-weight: 700; font-size: 11px; }
.p-gone { font-size: 10px; color: var(--muted); font-style: italic; margin-top: 2px; }
.p-dismiss {
  flex-shrink: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1;
  padding: 0 2px;
  cursor: pointer;
  border-radius: 3px;
}
.p-dismiss:hover { color: #ef4444; background: rgba(239,68,68,0.12); }

/* ── RIGHT PANEL ── */
.right-panel {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 12px;
  gap: 8px;
}
.board-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  flex-shrink: 0;
}
.draft-board {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  flex: 1;
  overflow-y: auto;
  align-content: start;
}
.board-col {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-height: 64px;
}
.col-hdr {
  font-size: 10px;
  font-weight: 800;
  text-align: center;
  padding: 4px 6px;
  background: var(--surface);
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  letter-spacing: 0.5px;
  flex-shrink: 0;
}
.col-hdr.cur { background: var(--accent); color: #fff; border-bottom-color: var(--accent); }
.b-card { margin: 0 4px; }
.b-card:last-child { margin-bottom: 4px; }

.b-card {
  border-radius: 5px;
  padding: 5px 7px;
  font-size: 11px;
  border: 1px solid transparent;
}
.b-card.pick       { background: #1a3a28; border-color: var(--green); }
.b-card.suggestion { background: var(--blue-bg);  border-color: #1e3560; opacity: 0.7; }
.b-card.priority   { background: var(--blue-bg2); border-color: var(--blue-light); box-shadow: 0 0 6px rgba(96,165,250,0.3); opacity: 0.85; }

.b-card.pick       .bc-name { color: #fff;              font-weight: 700; }
.b-card.suggestion .bc-name { color: var(--blue-light); font-weight: 500; }
.b-card.priority   .bc-name { color: var(--blue-light); font-weight: 700; }

.bc-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bc-meta { color: var(--muted); font-size: 10px; margin-top: 1px; }

/* ── COMPLETE STACKS ── */
.stacks-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  flex-shrink: 0;
  min-height: 0;
}
.stack-badge {
  background: var(--yellow-bg);
  border: 1px solid var(--yellow);
  color: var(--yellow);
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
}

/* ── SETTINGS MODAL ── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 24px;
  width: 340px;
}
.modal h2 { font-size: 15px; margin-bottom: 16px; }
.s-row { margin-bottom: 14px; }
.s-label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.btn-group { display: flex; gap: 6px; }
.opt {
  flex: 1;
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 6px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  user-select: none;
}
.opt.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.modal-footer { display: flex; justify-content: flex-end; margin-top: 18px; }

/* ── LOADING ── */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  font-size: 14px;
  color: var(--muted);
}

/* ── SCROLLBARS ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">🏈 NFL 2026 BEST BALL DRAFT ASSISTANT</div>
  <div class="header-right">
    <select class="draft-select" id="draft-select" onchange="switchDraft(this.value)">
      <option value="">Loading drafts…</option>
    </select>
    <button class="btn" onclick="openSettings()">⚙ Settings</button>
    <button class="btn" onclick="newDraft()">New Draft</button>
    <div class="round-badge" id="round-badge">R: 1</div>
  </div>
</div>

<div class="main" id="main">
  <div class="loading" id="loader">Loading draft data…</div>
</div>

<div class="overlay" id="settings-modal">
  <div class="modal">
    <h2>Draft Settings</h2>

    <div class="s-row">
      <div class="s-label">Draft Size (teams)</div>
      <div class="btn-group" id="g-size">
        <div class="opt" data-val="6">6</div>
        <div class="opt" data-val="8">8</div>
        <div class="opt active" data-val="10">10</div>
        <div class="opt" data-val="12">12</div>
      </div>
    </div>

    <div class="s-row">
      <div class="s-label">Rounds</div>
      <div class="btn-group" id="g-rounds">
        <div class="opt" data-val="15">15</div>
        <div class="opt" data-val="18">18</div>
        <div class="opt active" data-val="20">20</div>
      </div>
    </div>

    <div class="s-row">
      <div class="s-label">Show Playoff Score</div>
      <div class="btn-group" id="g-playoff">
        <div class="opt active" data-val="true">On</div>
        <div class="opt" data-val="false">Off</div>
      </div>
    </div>

    <div class="s-row">
      <div class="s-label">Stack Depth</div>
      <div class="btn-group" id="g-depth">
        <div class="opt" data-val="2">2-player</div>
        <div class="opt" data-val="3">3-player</div>
        <div class="opt active" data-val="all">All</div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn" onclick="closeSettings()">Close</button>
    </div>
  </div>
</div>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────

const cfg = { draftSize: 10, rounds: 20, showPlayoff: true, stackDepth: 'all' };
const LS_DRAFT_ID = 'bestball_active_draft_id';

let allPlayers   = [];
let allStacks    = [];
let draftedNames = new Set();
let skippedNames = new Set();
let draftedList  = [];          // [{player, round}]
let suggestions  = {};          // round → [{player, combinedValue, priorityCount}]
let selectedCard = null;
let posFilter    = 'All';
let searchText   = '';
let sortMode     = 'adp';       // 'adp' | 'ecr' | 'value'

let activeDraftId   = null;
let activeDraftName = null;

// ── PERSISTENCE ──────────────────────────────────────────────────────────

function generateDraftId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function savePick(player, round, pickType) {
  if (!activeDraftId) return;
  const name  = typeof player === 'string' ? player : player.player_name;
  const team  = typeof player === 'object' ? (player.team || '') : '';
  const pos   = typeof player === 'object' ? (player.position || '') : '';
  const adp   = typeof player === 'object' ? (player.adp || '') : '';
  const vs    = typeof player === 'object' ? (player.value_score || '') : '';
  const args  = [activeDraftId, activeDraftName, name, round, pickType, team, pos, adp, vs];
  google.script.run
    .withFailureHandler(function(err) {
      console.error('[savePick] failed, retrying:', name, err.message);
      google.script.run
        .withFailureHandler(function(err2) {
          console.error('[savePick] retry also failed:', name, err2.message);
        })
        .savePick(...args);
    })
    .savePick(...args);
}

function replayPicks(picks) {
  draftedNames = new Set();
  skippedNames = new Set();
  draftedList  = [];
  suggestions  = {};

  picks.filter(p => p.pick_type === 'skip').forEach(p => {
    skippedNames.add(p.player_name);
  });

  picks.filter(p => p.pick_type === 'pick')
    .sort((a, b) => a.round - b.round)
    .forEach(p => {
      const key    = normName(p.player_name);
      const player = allPlayers.find(x => normName(x.player_name) === key);
      if (!player) return;
      draftedNames.add(player.player_name);
      draftedList.push({ player, round: p.round });
      addSuggestions(player);
    });

  pruneSuggestions();
}

function populateDraftSelect(drafts, selectId) {
  const sel = document.getElementById('draft-select');
  if (!sel) return;
  sel.innerHTML = drafts.map(d =>
    `<option value="${d.id}"${d.id === selectId ? ' selected' : ''}>${d.name} (${d.pickCount} picks)</option>`
  ).join('');
}

// ── BOOT ─────────────────────────────────────────────────────────────────

google.script.run
  .withSuccessHandler(function(data) {
    allPlayers = data.players || [];
    allStacks  = data.stacks  || [];
    document.getElementById('loader').textContent = 'Loading drafts…';

    google.script.run
      .withSuccessHandler(function(drafts) {
        document.getElementById('loader').remove();

        const lastId = localStorage.getItem(LS_DRAFT_ID);
        let target   = drafts.find(d => d.id === lastId) || drafts[drafts.length - 1] || null;

        if (!target) {
          // Sheet is empty — auto-create first draft
          activeDraftId   = generateDraftId();
          activeDraftName = 'Draft 1';
          drafts = [{ id: activeDraftId, name: activeDraftName, pickCount: 0 }];
          target = drafts[0];
        } else {
          activeDraftId   = target.id;
          activeDraftName = target.name;
        }

        localStorage.setItem(LS_DRAFT_ID, activeDraftId);
        buildLayout();
        populateDraftSelect(drafts, activeDraftId);
        loadDraft(activeDraftId);
      })
      .withFailureHandler(function(err) {
        document.getElementById('loader').textContent = 'Error loading drafts: ' + err.message;
      })
      .getDrafts();
  })
  .withFailureHandler(function(err) {
    document.getElementById('loader').textContent = 'Error: ' + err.message;
  })
  .getDraftData();

function loadDraft(draftId) {
  google.script.run
    .withSuccessHandler(function(picks) {
      replayPicks(picks);
      selectedCard = null;
      const btn = document.getElementById('draft-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'DRAFT SELECTED'; }
      render();
    })
    .withFailureHandler(function(err) {
      console.error('loadDraft failed:', err.message);
    })
    .getDraftPicks(draftId);
}

function switchDraft(draftId) {
  if (!draftId || draftId === activeDraftId) return;
  const sel  = document.getElementById('draft-select');
  const name = sel ? sel.options[sel.selectedIndex].text.replace(/\s*\(\d+ picks\)$/, '') : '';
  activeDraftId   = draftId;
  activeDraftName = name;
  localStorage.setItem(LS_DRAFT_ID, draftId);
  loadDraft(draftId);
}

function newDraft() {
  const name = prompt('Draft name:', 'Draft ' + (document.getElementById('draft-select').options.length + 1));
  if (!name) return;

  activeDraftId   = generateDraftId();
  activeDraftName = name;
  localStorage.setItem(LS_DRAFT_ID, activeDraftId);

  const sel = document.getElementById('draft-select');
  const opt = document.createElement('option');
  opt.value    = activeDraftId;
  opt.text     = name + ' (0 picks)';
  opt.selected = true;
  sel.appendChild(opt);

  replayPicks([]);
  selectedCard = null;
  const btn = document.getElementById('draft-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'DRAFT SELECTED'; }
  render();
}

// ── LAYOUT ────────────────────────────────────────────────────────────────

function buildLayout() {
  document.getElementById('main').innerHTML = `
    <div class="left-panel">
      <div class="round-info" id="round-info"></div>
      <input class="search-box" id="search-box" placeholder="Search players…"
             oninput="onSearch(this.value)">
      <div class="sort-row" id="sort-row">
        <button class="sort-btn${sortMode==='adp'?' active':''}" data-sort="adp">ADP</button>
        <button class="sort-btn${sortMode==='ecr'?' active':''}" data-sort="ecr">Ranking</button>
        <button class="sort-btn${sortMode==='value'?' active':''}" data-sort="value">Value</button>
      </div>
      <div class="filter-row">
        ${['All','QB','RB','WR','TE'].map(p =>
          `<button class="pos-btn${p==='All'?' active':''}"
                   onclick="setPosFilter('${p}')">${p}</button>`
        ).join('')}
      </div>
      <div class="player-list" id="player-list"></div>
      <button class="btn-draft" id="draft-btn" disabled onclick="confirmPick()">
        DRAFT SELECTED
      </button>
    </div>
    <div class="right-panel">
      <div class="board-label">DRAFT BOARD</div>
      <div class="draft-board" id="board"></div>
      <div class="stacks-row" id="stacks-done"></div>
    </div>
  `;
  render();
  wirePlayerList();
  wireSortButtons();
}

// ── RENDER ────────────────────────────────────────────────────────────────

function render() {
  renderLeft();
  renderBoard();
}

function currentRound() { return draftedList.length + 1; }

function valueColor(score) {
  const v = Math.min(100, Math.max(0, score));
  return `hsl(${Math.round(v * 1.2)}, 78%, 50%)`;
}

function renderLeft() {
  const cr   = currentRound();
  const ri   = document.getElementById('round-info');
  const rb   = document.getElementById('round-badge');
  if (ri) ri.textContent = `Round ${cr} of ${cfg.rounds}`;
  if (rb) rb.textContent = `R: ${cr}`;

  let pool = allPlayers.filter(p =>
    !draftedNames.has(p.player_name) && !skippedNames.has(p.player_name)
  );

  if (posFilter !== 'All') {
    pool = pool.filter(p => String(p.position || '').startsWith(posFilter));
  }
  if (searchText) {
    const q = searchText.toLowerCase();
    pool = pool.filter(p =>
      String(p.player_name || '').toLowerCase().includes(q) ||
      String(p.team || '').toLowerCase().includes(q)
    );
  }

  if (sortMode === 'value') {
    pool.sort((a, b) => (Number(b.value_score) || 0) - (Number(a.value_score) || 0));
  } else if (sortMode === 'ecr') {
    pool.sort((a, b) => {
      const eA = (Number(a.adp) || 999) - (Number(a.ecr_vs_adp) || 0);
      const eB = (Number(b.adp) || 999) - (Number(b.ecr_vs_adp) || 0);
      return eA - eB;
    });
  } else {
    pool.sort((a, b) => (Number(a.adp) || 999) - (Number(b.adp) || 999));
  }

  const list = document.getElementById('player-list');
  if (!list) return;

  list.innerHTML = pool.map(p => {
    const isSel  = selectedCard && selectedCard.player_name === p.player_name;
    const isGone = allPartnersGone(p);
    const vs     = Math.round(Number(p.value_score) || 0);
    const ecrRaw = Number(p.ecr_vs_adp);
    const ecrStr = (!isNaN(ecrRaw) && ecrRaw !== 0)
      ? `<span style="color:${ecrRaw > 0 ? 'var(--green)' : '#ef4444'};font-weight:700">${ecrRaw > 0 ? '+' : ''}${Math.round(ecrRaw)}</span>`
      : '';
    const safeName = p.player_name.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    return `<div class="p-card${isSel ? ' selected' : ''}${isGone ? ' stack-gone' : ''}"
                 data-name="${safeName}">
      <div class="p-top">
        <div class="p-name">${p.player_name}</div>
        <span class="v-badge" style="color:${valueColor(vs)}">${vs}</span>
        <span class="p-dismiss" data-dismiss="${safeName}" title="Remove">✕</span>
      </div>
      <div class="p-meta">
        <span class="p-team">${p.team} · ${p.position} · ${Number(p.adp).toFixed(1)}</span>
        ${ecrStr}
        ${cfg.showPlayoff ? `<span class="sp">PO:${Math.round(Number(p.playoff_score) || 0)}</span>` : ''}
      </div>
      ${isGone ? '<div class="p-gone">stack partner gone</div>' : ''}
    </div>`;
  }).join('');
}

// A player's stacks are "all gone" if every stack they belong to has
// at least one partner already drafted
function allPartnersGone(player) {
  const stacks = stacksFor(player.player_name);
  if (!stacks.length) return false;
  return stacks.every(s =>
    partnersIn(s, player.player_name).some(n => draftedNames.has(n))
  );
}

// ── SELECTION ────────────────────────────────────────────────────────────

function selectPlayer(name) {
  const p = allPlayers.find(x => x.player_name === name);
  selectedCard = (selectedCard && selectedCard.player_name === name) ? null : (p || null);
  const btn = document.getElementById('draft-btn');
  if (btn) btn.disabled = !selectedCard;
  renderLeft();
}

function wirePlayerList() {
  const list = document.getElementById('player-list');
  if (!list) return;
  list.addEventListener('click', function(e) {
    const dismiss = e.target.closest('.p-dismiss');
    if (dismiss) {
      const dismissName   = dismiss.dataset.dismiss;
      const dismissPlayer = allPlayers.find(x => x.player_name === dismissName) || dismissName;
      skippedNames.add(dismissName);
      savePick(dismissPlayer, currentRound(), 'skip');
      if (selectedCard && selectedCard.player_name === dismissName) {
        selectedCard = null;
        document.getElementById('draft-btn').disabled = true;
      }
      render();
      return;
    }
    const card = e.target.closest('.p-card');
    if (card) selectPlayer(card.dataset.name);
  });
}

function incrementDropdownCount() {
  const sel = document.getElementById('draft-select');
  if (!sel) return;
  const opt = sel.options[sel.selectedIndex];
  if (!opt) return;
  opt.text = opt.text.replace(/\((\d+) picks?\)/, (_, n) => `(${Number(n) + 1} picks)`);
}

function wireSortButtons() {
  const row = document.getElementById('sort-row');
  if (!row) return;
  row.addEventListener('click', function(e) {
    const btn = e.target.closest('.sort-btn');
    if (!btn) return;
    sortMode = btn.dataset.sort;
    row.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b === btn));
    renderLeft();
  });
}

function onSearch(val) { searchText = val; renderLeft(); }

function setPosFilter(pos) {
  posFilter = pos;
  document.querySelectorAll('.pos-btn').forEach(b =>
    b.classList.toggle('active', b.textContent === pos)
  );
  renderLeft();
}

// ── DRAFT ────────────────────────────────────────────────────────────────

function confirmPick() {
  if (!selectedCard) return;
  const player = selectedCard;
  const round  = currentRound();

  draftedNames.add(player.player_name);
  draftedList.push({ player, round });
  selectedCard = null;

  addSuggestions(player);
  pruneSuggestions();
  savePick(player, round, 'pick');
  incrementDropdownCount();

  const btn = document.getElementById('draft-btn');
  if (btn) {
    btn.disabled = true;
    if (round >= cfg.rounds) btn.textContent = 'DRAFT COMPLETE';
  }

  render();
}

// ── SUGGESTIONS ──────────────────────────────────────────────────────────

function normName(n) { return String(n || '').trim().toLowerCase(); }

function stacksFor(playerName) {
  const key = normName(playerName);
  return allStacks.filter(s =>
    normName(s.player1_name) === key ||
    normName(s.player2_name) === key ||
    normName(s.player3_name) === key
  ).filter(depthMatch);
}

function depthMatch(stack) {
  if (cfg.stackDepth === 'all') return true;
  const has3 = stack.player3_name && String(stack.player3_name).trim() !== '';
  if (cfg.stackDepth === '2') return !has3;
  if (cfg.stackDepth === '3') return has3;
  return true;
}

function partnersIn(stack, excludeName) {
  return [stack.player1_name, stack.player2_name, stack.player3_name]
    .filter(n => n && String(n).trim() !== '' && n !== excludeName);
}

function addSuggestions(draftedPlayer) {
  const found = stacksFor(draftedPlayer.player_name);
  console.log(`[stacks] "${draftedPlayer.player_name}" → ${found.length} stacks found. allStacks total: ${allStacks.length}`);
  if (found.length > 0) console.log('[stacks] first match:', JSON.stringify(found[0]));
  found.forEach(stack => {
    partnersIn(stack, draftedPlayer.player_name).forEach(partnerName => {
      const pKey = normName(partnerName);
      if ([...draftedNames].some(n => normName(n) === pKey)) return;
      const p = allPlayers.find(x => normName(x.player_name) === pKey);
      if (!p) return;

      const r = Math.min(Math.max(Number(p.round) || 1, 1), cfg.rounds);
      if (!suggestions[r]) suggestions[r] = [];

      const existing = suggestions[r].find(s => s.player.player_name === partnerName);
      if (existing) {
        existing.priorityCount++;
        existing.combinedValue = Math.max(existing.combinedValue, Number(stack.combined_value) || 0);
      } else {
        suggestions[r].push({
          player:        p,
          combinedValue: Number(stack.combined_value) || 0,
          priorityCount: 1
        });
      }
    });
  });
}

function pruneSuggestions() {
  Object.keys(suggestions).forEach(r => {
    suggestions[r] = suggestions[r]
      .filter(s => !draftedNames.has(s.player.player_name))
      .sort((a, b) => b.combinedValue - a.combinedValue);
  });
}

// ── BOARD ────────────────────────────────────────────────────────────────

function renderBoard() {
  const board = document.getElementById('board');
  if (!board) return;
  const cr = currentRound();

  board.innerHTML = Array.from({ length: cfg.rounds }, (_, i) => i + 1).map(r => {
    const picks = draftedList.filter(d => d.round === r);
    const suggs = picks.length > 0 ? [] : (suggestions[r] || []).filter(s => !draftedNames.has(s.player.player_name) && !skippedNames.has(s.player.player_name));

    return `<div class="board-col">
      <div class="col-hdr${r === cr ? ' cur' : ''}">R${r}</div>
      ${picks.map(d => bCard(d.player, 'pick')).join('')}
      ${suggs.map(s => bCard(s.player, s.priorityCount >= 2 ? 'priority' : 'suggestion')).join('')}
    </div>`;
  }).join('');

  // Scroll current round column into view
  const cols = board.querySelectorAll('.board-col');
  if (cols[cr - 1]) {
    cols[cr - 1].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }

  renderCompletedStacks();
}

function bCard(player, type) {
  const vs  = Math.round(Number(player.value_score) || 0);
  const raw = Number(player.ecr_vs_adp);
  const ecr = (!isNaN(raw) && raw !== 0)
    ? `<span style="color:${raw > 0 ? 'var(--green)' : '#ef4444'};font-weight:700">${raw > 0 ? '+' : ''}${Math.round(raw)}</span>`
    : '';
  return `<div class="b-card ${type}">
    <div class="bc-name">${player.player_name}</div>
    <div class="bc-meta">${player.team} · ${player.position}</div>
    <div class="bc-meta" style="margin-top:2px">
      <span style="color:${valueColor(vs)};font-weight:700">${vs}</span>
      ${ecr ? `&nbsp;${ecr}` : ''}
    </div>
  </div>`;
}

function renderCompletedStacks() {
  const area = document.getElementById('stacks-done');
  if (!area) return;

  const seen    = new Set();
  const badges  = [];

  allStacks.forEach(s => {
    const names = [s.player1_name, s.player2_name, s.player3_name]
      .filter(n => n && String(n).trim() !== '');
    if (names.length < 2) return;
    if (!names.every(n => draftedNames.has(n))) return;

    const key = [...names].sort().join('|');
    if (seen.has(key)) return;
    seen.add(key);
    badges.push(`<div class="stack-badge">✓ ${names.join(' + ')}</div>`);
  });

  area.innerHTML = badges.join('');
}

// ── RESET ────────────────────────────────────────────────────────────────

function resetDraft() {
  newDraft();
  searchText = '';
  posFilter  = 'All';
  const sb = document.getElementById('search-box');
  if (sb) sb.value = '';
  document.querySelectorAll('.pos-btn').forEach(b =>
    b.classList.toggle('active', b.textContent === 'All')
  );
}

// ── SETTINGS ────────────────────────────────────────────────────────────

function openSettings()  { document.getElementById('settings-modal').classList.add('open'); }
function closeSettings() {
  document.getElementById('settings-modal').classList.remove('open');
  render();
}

function wireGroup(groupId, setter) {
  document.querySelectorAll('#' + groupId + ' .opt').forEach(b => {
    b.addEventListener('click', () => {
      setter(b.dataset.val);
      document.querySelectorAll('#' + groupId + ' .opt').forEach(x =>
        x.classList.toggle('active', x === b)
      );
    });
  });
}

wireGroup('g-size',    v => { cfg.draftSize   = Number(v); });
wireGroup('g-rounds',  v => { cfg.rounds      = Number(v); });
wireGroup('g-playoff', v => { cfg.showPlayoff = v === 'true'; });
wireGroup('g-depth',   v => { cfg.stackDepth  = v; });
</script>
